version: 2

models:
  - name: int_bookings_enriched
    description: >
      Bookings joined with hotel and customer attributes, plus a derived
      booking_status_category. Ephemeral - not queryable directly in Snowflake.
    columns:
      - name: booking_id
        tests:
          - unique
          - not_null

  - name: int_payments_summary
    description: >
      One row per booking with aggregated payment totals. Ephemeral.
    columns:
      - name: booking_id
        tests:
          - unique
